name: Threads トークン更新

on:
  schedule:
    # 毎月1日と15日（長期トークンの有効期限は60日）。
    # 0時ちょうどは設定が集中して飛ばされやすいので、少しずらしてある。
    - cron: "37 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: トークンを更新してシークレットを書き換える
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # リポジトリのシークレットを書き換える権限を持つ個人アクセストークン
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then
            echo "::notice::THREADS_ACCESS_TOKEN が未設定のため、スキップしました。"
            exit 0
          fi
          token_file="$RUNNER_TEMP/threads_token"
          python threads_bot/bot.py refresh --token-file "$token_file"
          # 文字列そのものは出さず、前回と同じか変わったかだけを調べる
          old_file="$RUNNER_TEMP/threads_token_old"
          printf '%s' "$THREADS_ACCESS_TOKEN" | tr -d '[:space:]' > "$old_file"
          if cmp -s "$old_file" "$token_file"; then
            echo "トークンの文字列は前回と同じです。有効期限だけが延びました。"
            changed=0
          else
            echo "トークンの文字列が新しくなりました。"
            changed=1
          fi
          rm -f "$old_file"
          if [ -n "$GH_TOKEN" ]; then
            gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$token_file"
            echo "シークレット THREADS_ACCESS_TOKEN を更新しました。"
          elif [ "$changed" = "1" ]; then
            # 保存してある文字列の期限も、更新のたびに延びることを確認済み（2026-11）。
            # 保存できなくても止まらないので、赤く失敗させず、メモだけ残す。
            echo "::notice::トークンの文字列は新しくなりましたが、GH_PAT が未設定のため保存していません。保存してある文字列の有効期限は延びているので、このままで問題ありません。"
          else
            echo "::notice::GH_PAT は未設定ですが、文字列が同じなので保存は不要です。"
          fi
          rm -f "$token_file"
