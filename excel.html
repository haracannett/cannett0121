<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>セル道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 方眼紙のような静かな下地に、練習用シートだけが「道具」として浮かぶ。黄色の蛍光ペン＝取り組むセル。 */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #18202e;
  --muted: #5a6577;
  --line: #d3d9e3;
  --head: #e6eaf1;
  --accent: #2346c4;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fb;
  --mark: #fff2a8;
  --mark-edge: #e0b400;
  --ok: #1d7f47;
  --ok-soft: #e1f3e8;
  --ng: #c0352a;
  --ng-soft: #fbe6e3;
  --r1: #2a62e0;
  --r2: #d1372b;
  --r3: #8a3fd1;
  --r4: #138a5a;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --surface: #181e28; --ink: #e4e8ef; --muted: #9aa4b6; --line: #2d3646; --head: #1f2632;
    --accent: #7f9cff; --accent-ink: #0d1220; --accent-soft: #232d48; --mark: #3d3510; --mark-edge: #c9a21a;
    --ok: #57c78a; --ok-soft: #173326; --ng: #ff7d6e; --ng-soft: #3a1c1a;
    --r1: #6f9bff; --r2: #ff7466; --r3: #c08bff; --r4: #4fd39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #181e28; --ink: #e4e8ef; --muted: #9aa4b6; --line: #2d3646; --head: #1f2632;
  --accent: #7f9cff; --accent-ink: #0d1220; --accent-soft: #232d48; --mark: #3d3510; --mark-edge: #c9a21a;
  --ok: #57c78a; --ok-soft: #173326; --ng: #ff7d6e; --ng-soft: #3a1c1a;
  --r1: #6f9bff; --r2: #ff7466; --r3: #c08bff; --r4: #4fd39a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.75;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code, .mono, kbd, .syntax, .keys, .finput, .grid, .namebox, .card .fx { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
code { background: var(--head); padding: 0.05em 0.35em; border-radius: 4px; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 12px; }
.logo { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.logo b { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; letter-spacing: 0.04em; line-height: 1; }
.logo span { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav a {
  text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-weight: 500; font-size: 0.92rem;
}
.nav a:hover { color: var(--ink); background: var(--head); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main { padding-block: 28px 64px; }
h1, h2, h3 { line-height: 1.35; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; }

/* ---------- home ---------- */
.intro { display: grid; gap: 8px; margin-bottom: 28px; max-width: 46rem; }
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.3rem); letter-spacing: 0.02em; }
.intro p { margin: 0; color: var(--muted); }
.level { margin-top: 36px; }
.level-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.level-head h2 { font-size: 1.25rem; display: flex; align-items: baseline; gap: 10px; }
.level-head h2 small { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter i { display: block; width: 140px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i u { display: block; height: 100%; background: var(--accent); text-decoration: none; transition: width .4s; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start;
  text-align: left; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  cursor: pointer; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .no {
  grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; color: var(--muted);
  border: 1px solid var(--line); background: var(--head);
}
.card.done .no { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.card h3 { font-size: 1rem; font-weight: 700; }
.card p { margin: 0; font-size: 0.84rem; color: var(--muted); line-height: 1.6; }
.card .fx { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); }

.side-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 40px; }
.side-links a {
  display: grid; gap: 2px; padding: 16px 18px; text-decoration: none; color: var(--ink);
  border: 1px dashed var(--line); border-radius: 8px; background: transparent;
}
.side-links a:hover { border-color: var(--accent); border-style: solid; }
.side-links b { font-size: 1rem; }
.side-links span { font-size: 0.84rem; color: var(--muted); }

/* ---------- lesson ---------- */
.back { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; margin-bottom: 14px; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 980px) { .lesson { grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start; } }
.lesson-text { display: grid; gap: 16px; min-width: 0; }
.lesson-text h1 { font-size: 1.5rem; }
.chip {
  display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; padding: 2px 10px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent);
}
.explain { display: grid; gap: 10px; }
.explain p { margin: 0; }
.explain ul { margin: 0; padding-left: 1.2em; }
.explain table { border-collapse: collapse; font-size: 0.88rem; }
.explain th, .explain td { border: 1px solid var(--line); padding: 3px 10px; text-align: left; }
.explain th { background: var(--head); font-weight: 500; }
.tablebox { overflow-x: auto; }
.syntax {
  font-family: var(--font-mono); font-size: 0.88rem; background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); padding: 8px 12px; overflow-x: auto; white-space: nowrap;
}
.task { background: var(--mark); border: 1px solid var(--mark-edge); border-radius: 8px; padding: 12px 14px; }
.task .eyebrow { color: var(--ink); opacity: .7; }
.task p { margin: 4px 0 0; }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details summary { cursor: pointer; padding: 8px 14px; font-weight: 500; font-size: 0.92rem; }
details > div { padding: 0 14px 12px; font-size: 0.9rem; }

.lesson-work { display: grid; gap: 14px; min-width: 0; }
.lesson-work > * { min-width: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.feedback { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; font-size: 0.92rem; }
.feedback.ok { background: var(--ok-soft); color: var(--ink); border: 1px solid var(--ok); }
.feedback.ng { background: var(--ng-soft); color: var(--ink); border: 1px solid var(--ng); }
.feedback b { font-size: 1rem; }
.feedback ul { margin: 0; padding-left: 1.2em; }

/* ---------- spreadsheet ---------- */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.fbar { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.namebox {
  width: 64px; flex: none; display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.85rem;
  border-right: 1px solid var(--line); background: var(--head);
}
.fx-label { flex: none; padding: 0 10px; display: grid; place-items: center; font-style: italic; color: var(--muted); font-family: Georgia, serif; border-right: 1px solid var(--line); }
.finput {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 10px; font-family: var(--font-mono); font-size: 0.95rem; outline: none;
}
.finput:focus { background: var(--accent-soft); }
.keys { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--head); }
.keys button {
  min-width: 34px; padding: 3px 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px;
  font-family: var(--font-mono); font-size: 0.85rem; cursor: pointer;
}
.keys button:hover { border-color: var(--accent); }
.keys .sep { flex: 1; }
.keys .wide { font-family: var(--font-body); font-weight: 500; }
.grid-wrap { overflow: auto; max-height: 470px; outline: none; }
.grid-wrap:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 0.9rem; user-select: none; -webkit-user-select: none; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 30px; padding: 0 8px; white-space: nowrap; }
.grid thead th {
  position: sticky; top: 0; z-index: 2; background: var(--head); font-weight: 500; color: var(--muted);
  font-size: 0.78rem; min-width: 92px; text-align: center;
}
.grid thead th:first-child { left: 0; z-index: 3; min-width: 40px; }
.grid tbody th {
  position: sticky; left: 0; z-index: 1; background: var(--head); font-weight: 500; color: var(--muted);
  font-size: 0.78rem; text-align: center; min-width: 40px; font-family: var(--font-mono);
}
.grid th.hl { color: var(--accent); background: var(--accent-soft); }
.grid td { cursor: cell; position: relative; background: var(--surface); }
.grid td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.86rem; }
.grid td.err { color: var(--ng); font-family: var(--font-mono); font-size: 0.82rem; }
.grid td.target { background: var(--mark); }
.grid td.target:empty::after { content: "?"; color: var(--mark-edge); font-weight: 700; }
.grid td.hd { font-weight: 700; }
.grid td.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.grid td.good { background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
.grid td.bad { background: var(--ng-soft); box-shadow: inset 0 0 0 1px var(--ng); }
.grid td.sel.good, .grid td.sel.bad { box-shadow: inset 0 0 0 2px var(--accent); }
.grid td.ref0 { outline: 2px dashed var(--r1); outline-offset: -3px; }
.grid td.ref1 { outline: 2px dashed var(--r2); outline-offset: -3px; }
.grid td.ref2 { outline: 2px dashed var(--r3); outline-offset: -3px; }
.grid td.ref3 { outline: 2px dashed var(--r4); outline-offset: -3px; }
.sheet-foot { padding: 6px 10px; font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 6px 16px; flex-wrap: wrap; }
.legend { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--mark-edge); background: var(--mark); }

/* ---------- quiz ---------- */
.quiz { max-width: 640px; display: grid; gap: 18px; }
.quiz-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; }
.qhead { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtext { font-size: 1.08rem; font-weight: 500; }
.choices { display: grid; gap: 8px; }
.choice {
  text-align: left; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice.right { background: var(--ok-soft); border-color: var(--ok); }
.choice.wrong { background: var(--ng-soft); border-color: var(--ng); }
.qexp { font-size: 0.9rem; border-top: 1px dashed var(--line); padding-top: 12px; }
.score { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-weight: 400; }

/* ---------- practice / reference ---------- */
.page-head { display: grid; gap: 6px; margin-bottom: 18px; max-width: 46rem; }
.page-head h1 { font-size: 1.5rem; }
.page-head p { margin: 0; color: var(--muted); }
.ref-table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 0.88rem; }
.ref-table th, .ref-table td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
.ref-table thead th { background: var(--head); font-weight: 500; font-size: 0.8rem; color: var(--muted); }
.ref-table td:first-child { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.ref-table .mono { white-space: nowrap; }
.ref-group { margin-top: 28px; display: grid; gap: 10px; }
.ref-group h2 { font-size: 1.05rem; }
.boxed { border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
kbd {
  font-family: var(--font-mono); font-size: 0.82em; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; background: var(--surface); white-space: nowrap;
}

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 0.88rem; z-index: 50;
  max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#lessons"><b>セル道場</b><span>Excel 初級・中級</span></a>
    <nav class="nav" aria-label="メニュー">
      <a href="#lessons" data-nav="lessons">レッスン</a>
      <a href="#quiz" data-nav="quiz">確認クイズ</a>
      <a href="#practice" data-nav="practice">自由練習</a>
      <a href="#reference" data-nav="reference">関数一覧</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   数式エンジン
   ===================================================================== */
const ERR = c => ({ err: c });
const isErr = v => v !== null && typeof v === "object" && "err" in v;

const toHalf = s => s.replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/　/g, " ");

// 引用符の外だけ半角に直す（日本語入力のまま打った「＝ＳＵＭ（」なども受け付ける）
function normFormula(s) {
  let out = "", q = false;
  for (const ch of s) {
    if ('"＂“”'.includes(ch)) { out += '"'; q = !q; continue; }
    if (q) { out += ch; continue; }
    out += ch === "、" ? "," : toHalf(ch);
  }
  return out;
}

const colNum = s => { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
const colName = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const addr = (c, r) => colName(c) + r;
const parseAddr = a => { const m = /^\$?([A-Z]+)\$?(\d+)$/i.exec(a); return { c: colNum(m[1]), r: +m[2] }; };

function literal(raw) {
  const s = toHalf(String(raw)).trim();
  if (s === "") return null;
  if (/^[-+]?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?$/.test(s)) return parseFloat(s.replace(/,/g, ""));
  if (/^[-+]?\d*\.\d+$/.test(s)) return parseFloat(s);
  if (/^[-+]?\d+(\.\d+)?%$/.test(s)) return parseFloat(s) / 100;
  if (/^(true|false)$/i.test(s)) return s.toUpperCase() === "TRUE";
  return String(raw);
}

function tokenize(s) {
  const t = [];
  let i = 0, m;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '"') {
      let j = i + 1, v = "";
      for (;;) {
        if (j >= s.length) throw ERR("#ERROR!");
        if (s[j] === '"') { if (s[j + 1] === '"') { v += '"'; j += 2; continue; } break; }
        v += s[j++];
      }
      t.push({ k: "str", v }); i = j + 1; continue;
    }
    const rest = s.slice(i);
    if ((m = /^(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?/.exec(rest))) { t.push({ k: "num", v: parseFloat(m[0]) }); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_][A-Za-z0-9_.]*(?=\s*\()/.exec(rest))) { t.push({ k: "fn", v: m[0].toUpperCase() }); i += m[0].length; continue; }
    if ((m = /^\$?[A-Za-z]{1,3}\$?\d+(?![A-Za-z0-9_])/.exec(rest))) { t.push({ k: "ref", v: m[0].toUpperCase().replace(/\$/g, "") }); i += m[0].length; continue; }
    if ((m = /^(TRUE|FALSE)(?![A-Za-z0-9_])/i.exec(rest))) { t.push({ k: "bool", v: m[0].toUpperCase() === "TRUE" }); i += m[0].length; continue; }
    if ((m = /^(<=|>=|<>|[-+*/^&=<>%:,()])/.exec(rest))) { t.push({ k: "op", v: m[0] }); i += m[0].length; continue; }
    if ((m = /^[^\s"(),+\-*/^&=<>%:]+/.exec(rest))) { t.push({ k: "name", v: m[0] }); i += m[0].length; continue; }
    throw ERR("#ERROR!");
  }
  return t;
}

function parse(tokens) {
  let p = 0;
  const peek = () => tokens[p];
  const isOp = v => peek() && peek().k === "op" && peek().v === v;
  const expect = v => { if (!isOp(v)) throw ERR("#ERROR!"); p++; };
  const CMP = ["=", "<>", "<", ">", "<=", ">="];
  function cmp() { let a = cat(); while (peek() && peek().k === "op" && CMP.includes(peek().v)) { const op = tokens[p++].v; a = { t: "bin", op, a, b: cat() }; } return a; }
  function cat() { let a = add(); while (isOp("&")) { p++; a = { t: "bin", op: "&", a, b: add() }; } return a; }
  function add() { let a = mul(); while (isOp("+") || isOp("-")) { const op = tokens[p++].v; a = { t: "bin", op, a, b: mul() }; } return a; }
  function mul() { let a = pow(); while (isOp("*") || isOp("/")) { const op = tokens[p++].v; a = { t: "bin", op, a, b: pow() }; } return a; }
  function pow() { let a = unary(); while (isOp("^")) { p++; a = { t: "bin", op: "^", a, b: unary() }; } return a; }
  function unary() { if (isOp("-")) { p++; return { t: "neg", a: unary() }; } if (isOp("+")) { p++; return unary(); } return postfix(); }
  function postfix() { let a = primary(); while (isOp("%")) { p++; a = { t: "pct", a }; } return a; }
  function primary() {
    const tk = tokens[p++];
    if (!tk) throw ERR("#ERROR!");
    if (tk.k === "num" || tk.k === "str" || tk.k === "bool") return { t: tk.k, v: tk.v };
    if (tk.k === "name") return { t: "name", v: tk.v };

function sc(v) {

function shiftFormula(raw, dr, dc) {
  if (!raw || raw[0] !== "=") return raw;
  return raw.split('"').map((seg, i) => i % 2 ? seg : seg.replace(
    /(^|[^A-Za-z0-9_$.])(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(])/g,
    (m, pre, d1, col, d2, row) => {

      if (!d1) c += dc;

      if (c < 1 || r < 1) return pre + "#REF!";
      return pre + d1 + colName(c) + d2 + r;
    })).join('"');
}

function display(v) {

          <button type="button" class="wide" data-act="fill" title="選択中のセルの数式を下の行へコピー">下へコピー ↓</button>
        </div>
        <div class="grid-wrap" tabindex="0" aria-label="ワークシート"><table class="grid"></table></div>
        <div class="sheet-foot">
          <span class="legend"><i></i>黄色のセルに入力</span>
          <span>数式は「=」から。入力中にセルをクリックすると番地が入ります</span>
        </div>
      </div>`;
    this.input = root.querySelector(".finput");
    this.namebox = root.querySelector(".namebox");
    this.wrapEl = root.querySelector(".grid-wrap");
    this.table = root.querySelector("table");
    this.bind();
  }

  load({ data = [], cols = 6, rows, targets = [], headers = true, sel }) {
    this.cells = {};
    data.forEach((row, r) => row.forEach((v, c) => { if (v !== "" && v != null) this.cells[addr(c + 1, r + 1)] = String(v); }));
    this.targets = new Set(targets);
    this.headers = new Set();
    if (headers) (data[0] || []).forEach((v, c) => { if (v !== "" && typeof v === "string") this.headers.add(addr(c + 1, 1)); });
    this.cols = Math.max(cols, ...data.map(r => r.length));
    this.rows = rows || data.length + 2;
    this.marks = {};
    this.build();
    this.select(sel || [...this.targets][0] || "A1");
  }
  setCells(cells) { this.cells = { ...cells }; this.render(); this.select(this.sel); }

  build() {
    let h = "<thead><tr><th></th>";
    for (let c = 1; c <= this.cols; c++) h += `<th data-col="${c}">${colName(c)}</th>`;
    h += "</tr></thead><tbody>";
    for (let r = 1; r <= this.rows; r++) {
      h += `<tr><th data-row="${r}">${r}</th>`;
      for (let c = 1; c <= this.cols; c++) h += `<td data-ref="${addr(c, r)}"></td>`;
      h += "</tr>";
    }
    this.table.innerHTML = h + "</tbody>";
    this.tds = {};
    this.table.querySelectorAll("td").forEach(td => this.tds[td.dataset.ref] = td);
    this.render();
  }

  engine() { return new Engine(this.cells); }
  render() {
    const eng = this.engine();
    for (const ref in this.tds) {
      const td = this.tds[ref], v = eng.value(ref);
      td.textContent = display(v);
      td.className = "";
      if (typeof v === "number") td.classList.add("num");
      if (isErr(v)) td.classList.add("err");
      if (this.targets.has(ref)) td.classList.add("target");
      if (this.headers.has(ref)) td.classList.add("hd");
      if (this.marks[ref]) td.classList.add(this.marks[ref]);
      if (ref === this.sel) td.classList.add("sel");
    }
    this.highlightRefs();
  }

  select(ref, focusGrid) {
    const old = this.tds[this.sel];
    if (old) old.classList.remove("sel");
    this.sel = ref;
    const td = this.tds[ref];
    if (td) { td.classList.add("sel"); td.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    const { c, r } = parseAddr(ref);
    this.table.querySelectorAll("th.hl").forEach(th => th.classList.remove("hl"));
    const ch = this.table.querySelector(`th[data-col="${c}"]`), rh = this.table.querySelector(`th[data-row="${r}"]`);
    if (ch) ch.classList.add("hl");
    if (rh) rh.classList.add("hl");
    this.namebox.textContent = ref;
    this.input.value = this.cells[ref] || "";
    this.dirty = false; this.ins = null;
    this.highlightRefs();
    if (focusGrid) this.wrapEl.focus({ preventScroll: true });
  }

  commit() {
    if (!this.dirty) return;
    let raw = this.input.value;
    if (/^[=＝]/.test(raw)) raw = "=" + normFormula(raw.slice(1)).trim();
    if (raw.trim() === "") delete this.cells[this.sel]; else this.cells[this.sel] = raw;
    this.dirty = false; this.ins = null;
    this.marks = {};
    this.render();
    if (this.opts.onChange) this.opts.onChange();
  }
  move(dr, dc) {
    const { c, r } = parseAddr(this.sel);
    const nc = Math.min(this.cols, Math.max(1, c + dc)), nr = Math.min(this.rows, Math.max(1, r + dr));
    this.select(addr(nc, nr), true);
  }
  edit(text) {
    if (text !== undefined) { this.input.value = text; this.dirty = true; }
    this.input.focus();
    const n = this.input.value.length;
    this.input.setSelectionRange(n, n);
    this.highlightRefs();
  }

  formulaMode() {
    const v = this.input.value;
    if (document.activeElement !== this.input || !/^[=＝]/.test(v)) return false;
    const s = this.input.selectionStart;
    if (this.ins && this.ins.value === v && s === this.ins.end) return true;
    return /[=＝(（,，、+\-*/&:<>^\s]$/.test(v.slice(0, s));
  }
  insertRef(ref, anchor) {
    const v = this.input.value;
    let s = this.input.selectionStart, e = this.input.selectionEnd;
    if (this.ins && this.ins.value === v && s === this.ins.end) { s = this.ins.start; e = this.ins.end; }
    let txt = ref;
    if (anchor && anchor !== ref) {
      const a = parseAddr(anchor), b = parseAddr(ref);
      txt = addr(Math.min(a.c, b.c), Math.min(a.r, b.r)) + ":" + addr(Math.max(a.c, b.c), Math.max(a.r, b.r));
    }
    this.input.value = v.slice(0, s) + txt + v.slice(e);
    const end = s + txt.length;
    this.input.setSelectionRange(end, end);
    this.ins = { start: s, end, value: this.input.value, anchor: anchor || ref };
    this.dirty = true;
    this.highlightRefs();
  }
  toggleAbs() {
    const v = this.input.value, caret = this.input.selectionStart ?? v.length;
    const re = /\$?[A-Za-z]{1,3}\$?\d+(?![A-Za-z0-9_(])/g;
    let m, best = null;
    while ((m = re.exec(v))) { if (m.index <= caret) best = m; }
    if (!best || !v.startsWith("=")) { toast("数式の中のセル番地にカーソルを置いてから押してください"); return; }
    const [, d1, col, d2, row] = /^(\$?)([A-Za-z]+)(\$?)(\d+)$/.exec(best[0]);
    const state = (d1 ? 2 : 0) + (d2 ? 1 : 0);
    const next = { 0: "$C$R", 3: "C$R", 1: "$CR", 2: "CR" }[state];
    const rep = next.replace("C", col.toUpperCase()).replace("R", row);
    this.input.value = v.slice(0, best.index) + rep + v.slice(best.index + best[0].length);
    const end = best.index + rep.length;
    this.input.focus();
    this.input.setSelectionRange(end, end);
    this.dirty = true; this.ins = null;
  }
  fillDown() {
    this.commit();
    const raw = this.cells[this.sel];
    if (!raw) { toast("コピーする数式が入ったセルを選んでください"); return; }
    const { c, r } = parseAddr(this.sel);
    const eng = this.engine();
    const filled = cc => { let end = r; while (end + 1 <= this.rows && cc >= 1 && cc <= this.cols && eng.value(addr(cc, end + 1)) !== null) end++; return end; };
    let end = filled(c - 1);
    if (end === r) end = filled(c + 1);
    if (end === r) { toast("隣の列にデータがある行までコピーします。下に続くデータがありません"); return; }
    for (let rr = r + 1; rr <= end; rr++) this.cells[addr(c, rr)] = shiftFormula(raw, rr - r, 0);
    this.marks = {};
    this.render();
    toast(`${this.sel} を ${addr(c, r + 1)}〜${addr(c, end)} にコピーしました`);
    if (this.opts.onChange) this.opts.onChange();
  }

  highlightRefs() {
    for (const ref in this.tds) this.tds[ref].classList.remove("ref0", "ref1", "ref2", "ref3");
    const v = this.input.value;
    if (!v.startsWith("=") && !v.startsWith("＝")) return;
    const src = normFormula(v.slice(1)).split('"').filter((_, i) => i % 2 === 0).join(" ");
    let m, k = 0;
    REF_RE.lastIndex = 0;
    while ((m = REF_RE.exec(src))) {
      const a = parseAddr(m[2]), b = m[3] ? parseAddr(m[3]) : a;
      for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r++)
        for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c++) {
          const td = this.tds[addr(c, r)];
          if (td) td.classList.add("ref" + (k % 4));
        }
      k++;
    }
  }

  bind() {
    const tdAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest && el.closest("td[data-ref]"); };
    this.table.addEventListener("pointerdown", ev => {
      const td = ev.target.closest("td[data-ref]");
      if (!td) return;
      if (this.formulaMode() || (this.ins && document.activeElement === this.input && this.ins.value === this.input.value)) {
        ev.preventDefault();
        this.insertRef(td.dataset.ref);
        this.drag = ev.pointerType === "mouse";
        this.skipClick = true;
      }
    });
    this.table.addEventListener("mousedown", ev => { if (this.skipClick) ev.preventDefault(); });
    this.table.addEventListener("pointermove", ev => {
      if (!this.drag || !this.ins) return;
      const td = tdAt(ev.clientX, ev.clientY);
      if (td) this.insertRef(td.dataset.ref, this.ins.anchor);
    });
    window.addEventListener("pointerup", () => { this.drag = false; });
    this.table.addEventListener("click", ev => {
      const td = ev.target.closest("td[data-ref]");
      if (!td) return;
      if (this.skipClick) { this.skipClick = false; this.input.focus(); return; }
      const ref = td.dataset.ref;
      if (ref === this.sel && this.lastClick === ref) { this.edit(); return; }
      this.commit();
      this.select(ref, true);
      this.lastClick = ref;
    });
    this.table.addEventListener("dblclick", ev => { const td = ev.target.closest("td[data-ref]"); if (td) this.edit(); });

    this.input.addEventListener("input", () => { this.dirty = true; this.highlightRefs(); });
    this.input.addEventListener("focus", () => { this.lastClick = null; });
    this.input.addEventListener("blur", () => { this.commit(); });
    this.input.addEventListener("keydown", ev => {
      if (ev.isComposing) return;
      if (ev.key === "Enter") { ev.preventDefault(); this.commit(); this.move(ev.shiftKey ? -1 : 1, 0); }
      else if (ev.key === "Tab") { ev.preventDefault(); this.commit(); this.move(0, ev.shiftKey ? -1 : 1); }
      else if (ev.key === "Escape") { ev.preventDefault(); this.dirty = false; this.select(this.sel, true); }
      else if (ev.key === "F4") { ev.preventDefault(); this.toggleAbs(); }
    });

    this.wrapEl.addEventListener("keydown", ev => {
      if (ev.target !== this.wrapEl) return;
      const k = ev.key, mod = ev.ctrlKey || ev.metaKey;
      const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
      if (arrows[k]) { ev.preventDefault(); this.move(...arrows[k]); }
      else if (k === "Enter") { ev.preventDefault(); this.move(ev.shiftKey ? -1 : 1, 0); }
      else if (k === "Tab") { ev.preventDefault(); this.move(0, ev.shiftKey ? -1 : 1); }
      else if (k === "F2") { ev.preventDefault(); this.edit(); }
      else if (k === "Delete" || k === "Backspace") { ev.preventDefault(); this.input.value = ""; this.dirty = true; this.commit(); this.select(this.sel, true); }
      else if (mod && k.toLowerCase() === "c") { ev.preventDefault(); this.clip = { raw: this.cells[this.sel] || "", from: this.sel }; toast(`${this.sel} をコピーしました`); }
      else if (mod && k.toLowerCase() === "v" && this.clip) {
        ev.preventDefault();
        const a = parseAddr(this.clip.from), b = parseAddr(this.sel);
        this.input.value = shiftFormula(this.clip.raw, b.r - a.r, b.c - a.c); this.dirty = true; this.commit(); this.select(this.sel, true);
      }
      else if (mod && k.toLowerCase() === "d") { ev.preventDefault(); this.fillDown(); }
      else if (k === "Process" || ev.isComposing) { this.edit(""); }
      else if (k.length === 1 && !mod && !ev.altKey) { ev.preventDefault(); this.edit(k); }
    });

    const keys = this.root.querySelector(".keys");
    keys.addEventListener("pointerdown", ev => { if (ev.target.closest("button")) ev.preventDefault(); });
    keys.addEventListener("mousedown", ev => { if (ev.target.closest("button")) ev.preventDefault(); });
    keys.addEventListener("click", ev => {
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.dataset.act === "fill") { this.fillDown(); return; }
      if (b.dataset.act === "f4") { this.toggleAbs(); return; }
      const t = b.dataset.ins;
      if (document.activeElement !== this.input) this.edit(t === "=" && !this.input.value ? "" : undefined);
      const v = this.input.value, s = this.input.selectionStart ?? v.length, e = this.input.selectionEnd ?? v.length;
      this.input.value = v.slice(0, s) + t + v.slice(e);
      this.input.setSelectionRange(s + t.length, s + t.length);
      this.dirty = true; this.ins = null;
      this.highlightRefs();
    });
  }
}

const store = {
  get(k, d) { try { const v = localStorage.getItem("celldojo." + k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("celldojo." + k, JSON.stringify(v)); } catch (_) { /* 保存できない環境では何もしない */ } },
};
let progress = store.get("progress", {});

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}

function expandTargets(lesson) {
  const out = [];
  for (const t of lesson.targets) {
    const [a, b] = t.range.split(":");
    const s = parseAddr(a), e = parseAddr(b || a);
    for (let r = s.r; r <= e.r; r++) for (let c = s.c; c <= e.c; c++)
      out.push({ ref: addr(c, r), answer: shiftFormula(t.answer, r - s.r, c - s.c), mustUse: t.mustUse });
  }
  return out;
}

/* ---- レッスン ---- */
function renderLesson(id) {
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) { renderHome(); return; }
  setNav("lessons");
  const idx = LESSONS.indexOf(lesson);
  const levelList = LESSONS.filter(l => l.level === lesson.level);
  const next = LESSONS[idx + 1];
  const targets = expandTargets(lesson);
  app.innerHTML = `
    <button type="button" class="back" id="back">← レッスン一覧</button>
    <div class="lesson">
      <div class="lesson-text">
        <div><span class="chip">${lesson.level} ${levelList.indexOf(lesson) + 1} / ${levelList.length}</span></div>
        <h1>${esc(lesson.title)}</h1>
        <div class="explain">${lesson.explain}</div>
        <div class="task"><div class="eyebrow">やってみよう</div><p>${lesson.task}</p></div>
        <details><summary>ヒント</summary><div>${lesson.hint}</div></details>
        <details><summary>答えの数式を見る</summary><div>${lesson.targets.map(t => `<div><code>${esc(t.range.split(":")[0])}</code>：<code>${esc(t.answer)}</code>${t.range.includes(":") ? `（${esc(t.range.split(":")[1])} までコピー）` : ""}</div>`).join("")}
          <p style="margin:6px 0 0;color:var(--muted)">同じ結果になれば、別の書き方でも正解です。</p></div></details>
      </div>
      <div class="lesson-work">
        <div id="sheet"></div>
        <div class="actions">
          <button type="button" class="btn primary" id="check">答え合わせ</button>
          <button type="button" class="btn" id="reset">最初からやり直す</button>
        </div>
        <div id="feedback" aria-live="polite"></div>
      </div>
    </div>`;
  document.getElementById("back").addEventListener("click", () => { location.hash = "lessons"; });
  const fb = document.getElementById("feedback");
  const sheet = new SheetUI(document.getElementById("sheet"), "lesson-" + id, { onChange: () => { fb.innerHTML = ""; } });
  const load = () => sheet.load({ ...lesson.sheet, targets: targets.map(t => t.ref) });
  load();

  document.getElementById("reset").addEventListener("click", () => { load(); fb.innerHTML = ""; });
  document.getElementById("check").addEventListener("click", () => {
    sheet.commit();
    const eng = sheet.engine();
    const probs = [];
    sheet.marks = {};
    for (const t of targets) {
      const raw = sheet.cells[t.ref];
      let msg = null;
      if (!raw) msg = `${t.ref} がまだ空です。`;
      else if (raw[0] !== "=") msg = `${t.ref} に値が直接入力されています。「=」から始まる数式で求めましょう。`;
      else {
        const v = eng.value(t.ref);
        const want = new Engine({ ...sheet.cells, [t.ref]: t.answer }).value(t.ref);
        const upper = raw.toUpperCase();
        const missing = (t.mustUse || lesson.mustUse || []).filter(f => !new RegExp("(^|[^A-Z.])" + f + "\\(").test(upper));
        if (isErr(v)) msg = `${t.ref} が ${v.err} になっています。${ERR_HELP[v.err] || ""}`;
        else if (!sameValue(v, want)) msg = `${t.ref} の結果が「${display(v)}」になっています（正しい結果：${display(want)}）。`;
        else if (missing.length) msg = `${t.ref} は結果は合っていますが、このレッスンでは ${missing.join("・")} を使って求めてみましょう。`;
      }
      sheet.marks[t.ref] = msg ? "bad" : "good";
      if (msg) probs.push(msg);
    }
    sheet.render();
    if (!probs.length) {
      const first = !progress[lesson.id];
      progress[lesson.id] = true;
      store.set("progress", progress);
      fb.innerHTML = `<div class="feedback ok"><b>正解です。</b>
        ${lesson.after ? `<span>${lesson.after}</span>` : ""}
        ${first ? `<span>「${esc(lesson.title)}」を完了しました。</span>` : ""}
        <div class="actions" style="margin-top:6px">${next ? `<button type="button" class="btn primary" id="next">次へ：${esc(next.title)} →</button>` : `<button type="button" class="btn primary" id="next">全レッスン完了！ 確認クイズへ →</button>`}</div></div>`;
      document.getElementById("next").addEventListener("click", () => { location.hash = next ? "lesson-" + next.id : "quiz"; });
    } else {
      fb.innerHTML = `<div class="feedback ng"><b>もう少しです。</b><ul>${probs.slice(0, 4).map(p => `<li>${esc(p)}</li>`).join("")}${probs.length > 4 ? `<li>ほか ${probs.length - 4} か所</li>` : ""}</ul>
        ${lesson.ngHint ? `<span>${lesson.ngHint}</span>` : ""}</div>`;
    }
  });
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderQuiz(level) {
  setNav("quiz");
  level = level || "初級";
  const qs = shuffle(QUIZ[level]).map(q => ({ ...q, order: shuffle(q.c.map((_, i) => i)) }));
  let i = 0, score = 0;
  const best = store.get("quizbest", {});
  app.innerHTML = `
    <div class="quiz">
      <div class="page-head"><h1>確認クイズ</h1><p>4択 × 10問。解説を読んで、わからなかったところはレッスンに戻りましょう。</p></div>
      <div class="quiz-pick">${["初級", "中級"].map(l => `<button type="button" class="btn${l === level ? " primary" : ""}" data-level="${l}">${l}${best[l] != null ? `（最高 ${best[l]}/10）` : ""}</button>`).join("")}</div>
      <div id="qbox"></div>
    </div>`;
  app.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => renderQuiz(b.dataset.level)));
  const box = document.getElementById("qbox");
  function show() {
    if (i >= qs.length) {
      if (best[level] == null || score > best[level]) { best[level] = score; store.set("quizbest", best); }
      const msg = score === 10 ? "全問正解です。" : score >= 7 ? "よくできました。間違えた問題の解説を見直しておきましょう。" : "レッスンに戻って、もう一度挑戦してみましょう。";
      box.innerHTML = `<div class="qcard"><div class="qhead"><span>${level}の結果</span></div>
        <div><span class="score">${score}</span> / ${qs.length} 問正解</div><p style="margin:0">${msg}</p>
        <div class="actions"><button type="button" class="btn primary" id="retry">もう一度</button><a class="btn" href="#lessons" style="text-decoration:none">レッスンへ</a></div></div>`;
      document.getElementById("retry").addEventListener("click", () => renderQuiz(level));
      return;
    }
    const q = qs[i];
    box.innerHTML = `<div class="qcard">
      <div class="qhead"><span>${level} 第${i + 1}問</span><span>${score} 問正解</span></div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="choices">${q.order.map(k => `<button type="button" class="choice" data-k="${k}">${esc(q.c[k])}</button>`).join("")}</div>
      <div id="qexp"></div></div>`;
    box.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
      const k = +btn.dataset.k, ok = k === q.a;
      if (ok) score++;
      box.querySelectorAll(".choice").forEach(b => { b.disabled = true; if (+b.dataset.k === q.a) b.classList.add("right"); });
      if (!ok) btn.classList.add("wrong");
      document.getElementById("qexp").innerHTML = `<div class="qexp"><b>${ok ? "正解" : "不正解"}</b>　${esc(q.e)}
        <div class="actions" style="margin-top:10px"><button type="button" class="btn primary" id="qnext">${i + 1 < qs.length ? "次の問題" : "結果を見る"}</button></div></div>`;
      const nb = document.getElementById("qnext");
      nb.addEventListener("click", () => { i++; show(); });
      nb.focus();
    }));
  }
  show();
}

/* ---- 自由練習 ---- */
function renderPractice() {
  setNav("practice");
  app.innerHTML = `
    <div class="page-head"><h1>自由練習シート</h1>
      <p>サンプルの家計簿が入っています。数字を書き換えたり、新しい数式を足したりして自由に試してください。内容はこのブラウザに保存されます。</p></div>
    <div id="psheet"></div>
    <div class="actions" style="margin-top:12px">
      <button type="button" class="btn" id="psample">サンプルに戻す</button>
      <button type="button" class="btn" id="pclear">すべて消す</button>
    </div>`;
  const sheet = new SheetUI(document.getElementById("psheet"), "practice", { onChange: () => store.set("practice", sheet.cells) });
  sheet.root.querySelector(".legend").remove();
  sheet.load({ data: PRACTICE_SAMPLE, cols: 8, rows: 20, sel: "B11" });
  const saved = store.get("practice", null);
  if (saved) sheet.setCells(saved);
  document.getElementById("psample").addEventListener("click", () => { sheet.load({ data: PRACTICE_SAMPLE, cols: 8, rows: 20, sel: "B11" }); store.set("practice", null); toast("サンプルに戻しました"); });
  document.getElementById("pclear").addEventListener("click", () => { sheet.setCells({}); sheet.headers = new Set(); sheet.render(); store.set("practice", {}); toast("シートを空にしました"); });
}

    ${REFERENCE.map(g => `
      <section class="ref-group"><h2>${g.group}</h2>
        <div class="boxed"><table class="ref-table">
          <thead><tr><th>関数</th><th>書き方</th><th>働き</th><th>例</th><th>レベル</th></tr></thead>
          <tbody>${g.items.map(([n, s, d, ex, lv]) => `<tr><td>${esc(n)}</td><td class="mono">${esc(s)}</td><td>${esc(d)}</td><td class="mono">${esc(ex)}</td><td>${lv}</td></tr>`).join("")}</tbody>
        </table></div></section>`).join("")}
    <section class="ref-group"><h2>覚えておきたいショートカット（Windows）</h2>
      <div class="boxed"><table class="ref-table">
        <thead><tr><th>キー</th><th>操作</th></tr></thead>
        <tbody>${SHORTCUTS.map(([k, d]) => `<tr><td>${k.split(" + ").map(x => x.includes("/") ? x.split(" / ").map(y => `<kbd>${esc(y)}</kbd>`).join(" / ") : `<kbd>${esc(x)}</kbd>`).join(" + ")}</td><td>${esc(d)}</td></tr>`).join("")}</tbody>

/* ---- ルーティング ---- */
function route() {
  const h = location.hash.replace("#", "");
  window.scrollTo(0, 0);
  if (h.startsWith("lesson-")) renderLesson(h.slice(7));
  else if (h === "quiz") renderQuiz();
  else if (h === "practice") renderPractice();
  else if (h === "reference") renderReference();
  else renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>
